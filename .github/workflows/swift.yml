name: Swift

on:
  push:
    branches: [ "master", "development" ]
  pull_request:
    branches: [ "master", "development", "feat/connect-timeout" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      # The E2E tests spawn the Node fixture server from PATH, so pin it here
      # instead of inheriting whatever the runner image happens to ship.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Build
        run: swift build -v
      - name: Run tests
        run: swift test -v

  protocol-proofs:
    name: Protocol proofs (wire-level, no Swift toolchain)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install fixture server
        run: npm install --no-audit --no-fund
        working-directory: Tests/TestSocketIO/E2E/Fixtures
      - name: Prove the upgrade must wait for a pending POST
        run: node upgrade-race-proof.mjs
        working-directory: Tests/TestSocketIO/E2E/Fixtures
      - name: Prove a polling batch must stay under maxPayload
        run: node max-payload-proof.mjs
        working-directory: Tests/TestSocketIO/E2E/Fixtures
