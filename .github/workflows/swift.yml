name: Swift

on:
  push:
    branches: [fix/client-parity-followup]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.ref == 'refs/heads/fix/client-parity-followup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: 37e8b039f3db1d30beee320b4d97610711f3718f
      - name: Export reviewed baseline and pinned client reference
        run: |
          set -euo pipefail
          git archive --format=zip HEAD -o "$RUNNER_TEMP/swift-baseline.zip"
          git init "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/socketio/socket.io.git
          git -C "$RUNNER_TEMP/upstream" fetch --depth=1 origin aaf2af36ec8ad05910f357a788e0e358bad32738
          git -C "$RUNNER_TEMP/upstream" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/upstream" archive --format=zip HEAD -o "$RUNNER_TEMP/js-reference.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: parity-source-snapshot
          retention-days: 1
          path: |
            ${{ runner.temp }}/swift-baseline.zip
            ${{ runner.temp }}/js-reference.zip
