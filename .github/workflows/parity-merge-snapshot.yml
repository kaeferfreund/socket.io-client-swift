name: Temporary parity merge snapshot

on:
  push:
    branches: ["fix/remaining-client-parity"]
    paths: [".github/workflows/parity-merge-snapshot.yml"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export the exact source and target histories for conflict resolution
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/feat/socketio4-swift6.4)" = 3237747dbf6486bc59672288c5e6df25eaf369f7
          git cat-file -e fcb4ecc9c717182d78ff5af8fa6271c2588cf066^{commit}
          git update-ref refs/merge-snapshot/source fcb4ecc9c717182d78ff5af8fa6271c2588cf066
          git update-ref refs/merge-snapshot/target 3237747dbf6486bc59672288c5e6df25eaf369f7
          git bundle create "$RUNNER_TEMP/parity-merge.bundle" refs/merge-snapshot/source refs/merge-snapshot/target
          git bundle verify "$RUNNER_TEMP/parity-merge.bundle"
      - uses: actions/upload-artifact@v4
        with:
          name: parity-merge-snapshot-${{ github.run_id }}
          path: ${{ runner.temp }}/parity-merge.bundle
          retention-days: 1
