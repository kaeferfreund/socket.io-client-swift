name: Prepare reviewed parity integration

on:
  push:
    branches: ["fix/remaining-client-parity"]
    paths: [".github/workflows/parity-merge-prepare.yml", ".github/parity-merge/prepare.py"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize the reviewed merge and upload unpublished Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/remaining-client-parity
          test "$(git rev-parse origin/feat/socketio4-swift6.4)" = 3237747dbf6486bc59672288c5e6df25eaf369f7
          cp .github/parity-merge/prepare.py "$RUNNER_TEMP/prepare-parity-merge.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach fcb4ecc9c717182d78ff5af8fa6271c2588cf066
          git branch source fcb4ecc9c717182d78ff5af8fa6271c2588cf066
          git branch target 3237747dbf6486bc59672288c5e6df25eaf369f7
          set +e
          git merge --no-commit --no-ff target
          status=$?
          set -e
          test "$status" -le 1
          python3 "$RUNNER_TEMP/prepare-parity-merge.py"
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-parity-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared-merge.json
          retention-days: 1
