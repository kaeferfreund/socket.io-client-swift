name: Parity review snapshot (temporary)
on:
  push:
    branches: [fix/coderabbit-findings-audit]
    paths: [.github/workflows/parity-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Snapshot review inputs without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/parity-review"
          git bundle create "$RUNNER_TEMP/parity-review/swift.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/parity-review/swift-sha.txt"
          git clone --depth 1 https://github.com/socketio/socket.io.git "$RUNNER_TEMP/socketio-upstream"
          git -C "$RUNNER_TEMP/socketio-upstream" rev-parse HEAD > "$RUNNER_TEMP/parity-review/javascript-sha.txt"
          git -C "$RUNNER_TEMP/socketio-upstream" archive --format=tar.gz --output="$RUNNER_TEMP/parity-review/javascript.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: parity-review-sources
          path: ${{ runner.temp }}/parity-review/
          retention-days: 7
