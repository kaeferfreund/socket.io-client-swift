name: Publish reviewed CodeRabbit audit (temporary)
on:
  push:
    branches: [fix/coderabbit-findings-audit]
    paths: [.github/workflows/coderabbit-audit-publish.yml]
permissions:
  contents: write
jobs:
  publish-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply exact reviewed patch and publish only to the audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          repo = 'kaeferfreund/socket.io-client-swift'
          branch = 'fix/coderabbit-findings-audit'
          workflow = '.github/workflows/coderabbit-audit-publish.yml'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('diff', '--name-only', '08dfcfe9e43c2ece85c259f0dd6a41073fdba70a', 'HEAD').splitlines() == [workflow]
          chunks = ['86f37efe65fecf529d7fe1a4e8dc7bfb72487ced', '2b90dc74ff055bfb9c9a7bb1c7d17cd4da8a0b3d', '0cc1ba0a5aeebf6028d0f0a05675a41c31b76744', '789abed80cf85302f544a38a19cc4df5189e3b43']
          compressed = bytearray()
          for sha in chunks:
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'source-audit'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['encoding'] == 'base64'
              part = base64.b64decode(blob['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              compressed.extend(part)
          patch = gzip.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == 'e308bacabdb198e9240c75bba6a83afdcd968669f24c5484dc2e7b2c787ad7f9'
          subprocess.run(['git', 'apply', '--index', '--whitespace=error-all', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '--', workflow], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'diff', '--exit-code', 'b613ef4c501df7b1ac32911b9a211312f496410b', '--', 'Source/SocketIO/Client/SocketIOClient.swift', 'Source/SocketIO/Manager/SocketManager.swift'], check=True)
          tree = git('write-tree')
          assert tree == '64f7414cb0f3a01e29322be671e64760a40303d7', tree
          env = dict(os.environ, GIT_AUTHOR_NAME='github-actions[bot]', GIT_COMMITTER_NAME='github-actions[bot]', GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com', GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com')
          message = 'fix: address outstanding CodeRabbit findings across merged PRs\n\nAudit all 17 PRs and map 12 published findings. Serialize close-only polling\nshutdown after retiring POSTs, bound teardown, and isolate replacement sessions.\nAdd seven controlled URLSession regressions and six Node polling-observer tests.\nStrengthen server-ID, reconnect and active-cache assertions; correct stale docs.\nRemove temporary audit tooling. Full Apple CI remains a PR validation gate.\n'
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-p', os.environ['GITHUB_SHA']], input=message, text=True, env=env).strip()
          subprocess.run(['git', 'push', 'origin', commit + ':refs/heads/' + branch], check=True)
          subprocess.run(['git', 'update-ref', 'refs/heads/audit-published', commit], check=True)
          bundle = str(Path(os.environ['RUNNER_TEMP']) / 'coderabbit-reviewed-source.bundle')
          subprocess.run(['git', 'bundle', 'create', bundle, 'refs/heads/audit-published'], check=True)
          print('Published source commit:', commit, 'tree:', tree)
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(f'Published reviewed source `{commit}` with exact tree `{tree}`. Temporary workflows removed. Full tests run in the read-only PR workflow; no test pass is claimed by this publication step.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: coderabbit-reviewed-source
          path: ${{ runner.temp }}/coderabbit-reviewed-source.bundle
          retention-days: 7
          if-no-files-found: error
