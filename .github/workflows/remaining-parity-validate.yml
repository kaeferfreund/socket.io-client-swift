name: Remaining parity validation
on:
  push:
    branches: ["fix/remaining-client-parity"]
permissions:
  contents: write
concurrency:
  group: remaining-parity-preflight
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Materialize reviewed changes on the isolated feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/remaining-client-parity
          python3 scripts/options-parity-materialize.py
          python3 scripts/errors-parity-materialize.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Source/SocketIO/Engine/Transport/WebSocketSessionDelegateProxy.swift')
          s=p.read_text().replace('let code = task.closeCode','let code = task?.closeCode').replace('code.rawValue, task.closeReason','code?.rawValue, task?.closeReason')
          p.write_text(s)
          PY
          python3 scripts/refine-remaining-parity.py
          git diff --check
      - name: Install locked server fixtures and verify passive observation
        working-directory: Tests/TestSocketIO/E2E/Fixtures
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test engine-parity-observer.test.mjs
      - name: Run new transport regressions first
        run: |
          set -o pipefail
          swift test --filter 'EngineRemainingParityE2ETest|SocketRemainingParityTest|SocketRemainingBinaryParserTest|SocketClearAcksOnCloseTest' 2>&1 | tee "$RUNNER_TEMP/remaining-focused.log"
      - name: Run complete native regression suite
        run: |
          set -o pipefail
          swift test --enable-code-coverage 2>&1 | tee "$RUNNER_TEMP/remaining-native.log"
      - name: Verify contract executions and coverage
        run: |
          python3 scripts/check-parity-contracts.py --swift-log "$RUNNER_TEMP/remaining-native.log"
          swift test --show-codecov-path > "$RUNNER_TEMP/codecov-path.txt"
          python3 scripts/report-swift-coverage.py "$(cat "$RUNNER_TEMP/codecov-path.txt")" | tee "$RUNNER_TEMP/remaining-coverage.json"
      - name: Publish only the tested source to this feature branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/remaining-client-parity
          test "$(git ls-remote origin refs/heads/fix/remaining-client-parity | cut -f1)" = "$GITHUB_SHA"
          rm .github/workflows/parity-source-export.yml .github/workflows/remaining-parity-validate.yml scripts/options-parity-materialize.py scripts/errors-parity-materialize.py scripts/refine-remaining-parity.py
          git add Source Tests scripts .github
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: add native credential, base64 and transport-error parity with regressions'
          git push origin HEAD:refs/heads/fix/remaining-client-parity
          git archive --format=zip HEAD > "$RUNNER_TEMP/remaining-tested-source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/remaining-source-head.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remaining-parity-preflight-${{ github.run_id }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/remaining-focused.log
            ${{ runner.temp }}/remaining-native.log
            ${{ runner.temp }}/remaining-coverage.json
            ${{ runner.temp }}/remaining-tested-source.zip
            ${{ runner.temp }}/remaining-source-head.txt
