name: Protocol review completion (temporary)
on:
  push:
    branches: [fix/coderabbit-findings-audit]
    paths: [.github/workflows/review-completion.yml, '.review-completion/**']
permissions:
  contents: write
concurrency:
  group: protocol-review-completion
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'kaeferfreund/socket.io-client-swift'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Apply reviewed heartbeat, identity and evidence patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          encoded = ''.join(Path(f'.review-completion/part{i}').read_text().strip() for i in range(6))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6914d77bda2ed23e0f85540d25aeb24f11a5a918deac3c93ad372edbb198e904'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git diff --cached --check
      - name: Complete Swift unit and real-server suite
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/review-final-swift.log
      - name: Four Apple framework SDK builds
        run: |
          set -o pipefail
          bash scripts/test-native-distributions.sh 2>&1 | tee /tmp/review-final-distributions.log
      - name: Parser safety, observer and wire proofs
        run: |
          set -o pipefail
          bash scripts/test-parser-safety.sh 2>&1 | tee /tmp/review-final-parser.log
          cd Tests/TestSocketIO/E2E/Fixtures
          node --test polling-proof-observer.test.mjs
          node upgrade-race-proof.mjs
          node max-payload-proof.mjs
      - name: Differential decoder and complete upstream test inventory
        run: |
          npm install --prefix "$RUNNER_TEMP/parity-tools" --ignore-scripts --no-audit --no-fund typescript@5.8.3
          git init "$RUNNER_TEMP/pinned-upstream"
          git -C "$RUNNER_TEMP/pinned-upstream" remote add origin https://github.com/socketio/socket.io.git
          git -C "$RUNNER_TEMP/pinned-upstream" fetch --depth=1 origin aaf2af36ec8ad05910f357a788e0e358bad32738
          git -C "$RUNNER_TEMP/pinned-upstream" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-upstream" rev-parse HEAD)" = aaf2af36ec8ad05910f357a788e0e358bad32738
          export NODE_PATH="$RUNNER_TEMP/parity-tools/node_modules"
          set -o pipefail
          bash scripts/test-parser-parity.sh "$RUNNER_TEMP/pinned-upstream" /tmp/review-final-decoder.json 2>&1 | tee /tmp/review-final-differential.log
          node scripts/inventory-upstream-tests.cjs "$RUNNER_TEMP/pinned-upstream" /tmp/review-final-inventory
      - name: Record measured results and remove temporary tooling
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess
          from pathlib import Path
          log = Path('/tmp/review-final-swift.log').read_text()
          counts = [int(n) for n in re.findall(r'Executed (\d+) tests, with 0 failures', log)]
          assert counts and max(counts) >= 470, counts
          differential = json.loads(Path('/tmp/review-final-decoder.json').read_text())
          assert differential['validCases'] == 5000 and differential['validDifferences'] == 0
          assert len(differential['differences']) == 8
          files = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          digests = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in sorted(files) if Path(p).is_file() and (p.startswith(('Source/', 'Tests/', 'scripts/')) or p == 'Package.swift')}
          evidence = {
            'run_id': os.environ['GITHUB_RUN_ID'],
            'run_url': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
            'checkout_sha': os.environ['GITHUB_SHA'],
            'swift_tests': max(counts), 'swift_failures': 0,
            'framework_sdk_builds': ['macOS', 'iOS Simulator', 'tvOS Simulator', 'watchOS Simulator'],
            'decoder_valid_cases': 5000, 'decoder_valid_differences': 0,
            'malformed_or_noncanonical_differences': 8,
            'parser_seeded_inputs': 20000, 'observer_tests': 6,
            'wire_proofs': ['pending POST upgrade ordering', 'maxPayload batching'],
            'upstream_sha': 'aaf2af36ec8ad05910f357a788e0e358bad32738',
            'validated_file_sha256': digests,
            'limitations': ['Not the complete upstream JavaScript test execution', 'No physical-device runtime tests', 'No exhaustive state-space proof', 'Open resource-budget and outgoing-encoder release gates in ProtocolParityReview.md']
          }
          Path('Documentation/ReviewEvidence/Validation.json').write_text(json.dumps(evidence, indent=2) + '\n')
          for directory in ['.protocol-review', '.review-completion']:
              shutil.rmtree(directory)
          for workflow in ['parity-review-snapshot.yml', 'protocol-review-validation.yml', 'review-completion.yml']:
              Path('.github/workflows', workflow).unlink()
          PY
      - name: Publish validated source to the requested branch only
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/coderabbit-findings-audit'
          test "$(git ls-remote origin refs/heads/fix/coderabbit-findings-audit | cut -f1)" = "$GITHUB_SHA"
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: enforce heartbeat and identity isolation; document measured parity and release gates'
          git push origin HEAD:refs/heads/fix/coderabbit-findings-audit
          git rev-parse HEAD > /tmp/review-final-validated-sha.txt
      - name: Preserve source-only diagnostics
        if: always()
        run: |
          git diff --binary > /tmp/review-final-unstaged.patch
          git diff --cached --binary > /tmp/review-final-source.patch
          git bundle create /tmp/review-final-source.bundle --all HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-review-completion
          retention-days: 7
          path: |
            /tmp/review-final-*.log
            /tmp/review-final-*.json
            /tmp/review-final-*.patch
            /tmp/review-final-source.bundle
            /tmp/review-final-validated-sha.txt
            /tmp/review-final-inventory/
