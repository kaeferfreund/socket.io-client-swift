name: Migrate remaining XCTest waits
on:
  push:
    branches: [feat/socketio4-swift6.4]
    paths: [.github/workflows/migration-xctest-waits.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'kaeferfreund/socket.io-client-swift' && github.ref == 'refs/heads/feat/socketio4-swift6.4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use explicit expectation sets without transferring XCTestCase isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manager = Path('Tests/TestSocketIO/SocketMangerTest.swift')
          text = manager.read_text()
          assignment_count = 0
          def name_expectation(match):
              global assignment_count
              assignment_count += 1
              name = f'managedExpectation{assignment_count}'
              return f'{match[1]}let {name} = {match[3]}\n{match[1]}{match[2]} = {name}'
          text = re.sub(r'(?m)^(        )((?:socket|socket2)\.expectations\[[^\n]+\]) = (expectation\(.*)$', name_expectation, text)
          assert assignment_count == 4, assignment_count
          manager.write_text(text)
          count = 0
          for path in Path('Tests').rglob('*.swift'):
              lines = path.read_text().splitlines(True)
              function_start = 0
              changed = False
              for i, line in enumerate(lines):
                  if re.match(r'    (?:(?:private|public|open|override|static) )*func ', line):
                      function_start = i
                  match = re.fullmatch(r'(\s*)waitForExpectations\(timeout:\s*([^,)]+)(?:,\s*handler:\s*nil)?\)\s*', line)
                  if not match:
                      continue
                  names = []
                  for previous in lines[function_start:i]:
                      declared = re.match(r'\s*let (\w+) = (?:self\.)?expectation\(', previous)
                      if declared:
                          names.append(declared[1])
                  assert names, (str(path), i + 1)
                  lines[i] = f'{match[1]}wait(for: [{", ".join(names)}], timeout: {match[2]})\n'
                  print(path.name, i + 1, names)
                  count += 1
                  changed = True
              if changed:
                  path.write_text(''.join(lines))
          assert count == 50, count
          PY
          git diff --check
          git add -u Tests
          git config user.name 'Manuel'
          git config user.email 'manuel.cargnel@rwth-aachen.de'
          git commit -m 'test: migrate all XCTest waits to explicit expectations for Swift 6'
          git push origin HEAD:refs/heads/feat/socketio4-swift6.4
