name: PR18 review-fix validation
on:
  push:
    branches: [fix/coderabbit-findings-audit]
    paths: [.github/workflows/review-fix-validation.yml, scripts/_review_fix.py, scripts/_review_fix_followup.py]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'kaeferfreund/socket.io-client-swift'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Apply hash-verified reviewed changes
        run: |
          python3 scripts/_review_fix_followup.py
          python3 scripts/_review_fix.py apply
          git -c core.whitespace=cr-at-eol diff --cached --check
      - name: Check review evidence and fixture guards
        run: |
          python3 scripts/test-review-regressions.py
          node --test Tests/TestSocketIO/E2E/Fixtures/server-socket-id.test.mjs Tests/TestSocketIO/E2E/Fixtures/polling-proof-observer.test.mjs
      - name: Check real parser source
        run: bash scripts/test-parser-safety.sh
      - name: Build and run native Swift tests
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/review-swift-tests.log"
      - name: Publish validated Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/_review_fix.py publish-tree
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-swift-tests.log
            ${{ runner.temp }}/review-result.json
          retention-days: 3
