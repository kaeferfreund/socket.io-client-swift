name: PR18 review-fix validation
on:
  push:
    branches: [fix/coderabbit-findings-audit]
    paths: [.github/workflows/review-fix-validation.yml, scripts/_review_fix.py, scripts/_review_fix_followup.py, scripts/_review_fix_namespace.py]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'kaeferfreund/socket.io-client-swift'
    runs-on: macos-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Apply hash-verified reviewed changes
        run: |
          python3 scripts/_review_fix_followup.py
          python3 scripts/_review_fix.py apply
          python3 scripts/_review_fix_namespace.py
          git -c core.whitespace=cr-at-eol diff --cached --check
      - name: Check review evidence and fixture guards
        run: |
          python3 scripts/test-review-regressions.py
          node --test Tests/TestSocketIO/E2E/Fixtures/server-socket-id.test.mjs Tests/TestSocketIO/E2E/Fixtures/polling-proof-observer.test.mjs
          bash scripts/test-parser-safety.sh
      - name: Store reviewed Git objects without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/_review_fix.py publish-tree
      - uses: actions/upload-artifact@v4
        with:
          name: review-tree-${{ github.run_id }}
          path: ${{ runner.temp }}/review-result.json
          retention-days: 3
      - name: Run bounded native regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          import os, signal, subprocess, sys
          path = os.path.join(os.environ['RUNNER_TEMP'], 'review-swift-tests.log')
          args = ['swift', 'test']
          with open(path, 'w') as log:
              process = subprocess.Popen(args, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
              try:
                  code = process.wait(timeout=360)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
                  code = 124
          print(open(path).read(), flush=True)
          sys.exit(code)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/review-swift-tests.log
          retention-days: 3
