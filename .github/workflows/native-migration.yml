name: Native migration publication (temporary)
on:
  push:
    branches: [feat/native-urlsession-transport]
    paths: ['.github/workflows/native-migration.yml']
permissions:
  contents: read
concurrency:
  group: native-migration-implementation
  cancel-in-progress: false
jobs:
  publish-validated-source:
    if: github.repository == 'kaeferfreund/socket.io-client-swift' && github.ref == 'refs/heads/feat/native-urlsession-transport'
    runs-on: macos-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Retrieve the exact source snapshot that passed all validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            'https://api.github.com/repos/kaeferfreund/socket.io-client-swift/actions/artifacts/10548180675/zip' \
            --output "$RUNNER_TEMP/native-validated.zip"
          python3 - <<'PY'
          import hashlib, os, subprocess, zipfile
          from pathlib import Path
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP']) / 'native-validated.zip') as archive:
              patch = archive.read('native-migration.patch')
              assert hashlib.sha256(patch).hexdigest() == '6228e2fb95232fb9fc7a4020fc3873f68f36d710859776a0013c4872f1c48490'
              log = archive.read('native-full-tests.log').decode()
              assert 'Executed 424 tests, with 0 failures (0 unexpected)' in log
          # Only the publication workflow differs from the validated checkout.
          changed = subprocess.check_output(['git', 'diff', '--name-only', 'd313c422f52f9931c90c8d911909bbd88870bf84', 'HEAD'], text=True).splitlines()
          assert changed == ['.github/workflows/native-migration.yml'], changed
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          p = Path('Source/SocketIO/Engine/SocketEngine.swift')
          source = p.read_bytes()
          assert source.endswith(b'\n\n')
          p.write_bytes(source.rstrip(b'\n') + b'\n')
          subprocess.run(['git', 'add', str(p)], check=True)
          PY
      - name: Rebuild the dependency-free library from the validated source
        run: swift build
      - name: Commit to the existing feature branch without modifying its base
        run: |
          test "$GITHUB_REPOSITORY" = 'kaeferfreund/socket.io-client-swift'
          test "$GITHUB_REF" = 'refs/heads/feat/native-urlsession-transport'
          git diff --exit-code 4458325db9c1c54af6551ef7ddba0febb999cdca -- Source/SocketIO/Manager Source/SocketIO/Client/SocketIOClient.swift
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          COMMIT=$(git commit-tree "$(git write-tree)" -p "$GITHUB_SHA" -p 4458325db9c1c54af6551ef7ddba0febb999cdca <<'MESSAGE'
          feat!: activate native URLSession transport and remove Starscream

          Integrate native ordered transport with Engine.IO lifecycle, upgrades,
          timeout isolation and strict shared TLS. Preserve the updated base's
          manager/client, ack timeouts and cache busting. Remove Starscream from
          every supported distribution and add engine and real TLS regressions.

          Exact source snapshot verified against artifact 10548180675 from run
          35347970435: 424 tests, zero failures; four Apple SDK framework builds;
          both wire protocol proofs. The only source difference is removing a
          trailing blank line. Dependency-free Swift build also rerun here.
          MESSAGE
          )
          echo "Validated source commit: $COMMIT"
          git push origin "$COMMIT:refs/heads/feat/native-urlsession-transport"
